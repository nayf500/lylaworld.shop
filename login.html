<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>دخول لوحة التحكم | عالم ليلى</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="login-box">
  <h1 style="margin-bottom:8px;font-size:22px;">لوحة تحكم عالم ليلى</h1>
  <p style="color:#8a7f7f;font-size:13px;margin-bottom:26px;">سجّلي الدخول لإدارة المنتجات والطلبات</p>
  <div class="form-group">
    <label>كلمة المرور</label>
    <input type="password" id="password" placeholder="••••••••">
  </div>
  <button class="btn-soft btn-block" onclick="login()">دخول</button>
  <div id="msg"></div>
</div>

<script>
  async function login() {
    const password = document.getElementById("password").value;
    const res = await fetch("/api/admin/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ password }),
    });
    if (res.ok) {
      location.href = "/admin/dashboard.html";
    } else {
      document.getElementById("msg").innerHTML = `<div class="msg error">كلمة المرور غير صحيحة</div>`;
    }
  }
  document.getElementById("password").addEventListener("keydown", (e) => {
    if (e.key === "Enter") login();
  });
</script>
</body>
</html>
