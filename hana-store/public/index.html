<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>عالم ليلى | ساعات نسائية</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<header class="site">
  <a class="logo" href="/">عالم ليلى</a>
  <nav class="main">
    <a href="/">الرئيسية</a>
    <a href="/shop.html">تسوّقي</a>
    <a href="/cart.html">السلة</a>
  </nav>
  <div class="header-actions">
    <a class="icon-btn" href="/cart.html">🛍<span class="cart-count">0</span></a>
  </div>
</header>

<section class="hero">
  <div class="hero-text">
    <span class="tag">✦ وصل حديثاً</span>
    <h1>وقتكِ… <em>بأسلوبكِ</em></h1>
    <p>ساعات نسائية ناعمة التصميم، خفيفة على المعصم، وحاضرة في كل تفصيلة من يومك.</p>
    <a href="/shop.html"><button class="btn-soft">تسوّقي الآن</button></a>
  </div>
  <div class="hero-visual">
    <div class="blob"></div>
    <div class="watch-round">
      <div class="watch-round-inner"><div class="h"></div><div class="m"></div></div>
    </div>
  </div>
</section>

<div class="section-head"><span>مختاراتنا</span><h2>الأكثر حباً هذا الشهر</h2></div>
<div class="grid" id="featured-grid">
  <p style="grid-column:1/-1;text-align:center;color:#aaa;">جارٍ التحميل...</p>
</div>

<footer class="site">
  <div class="logo">عالم ليلى</div>
  <p>© 2026 عالم ليلى للساعات — صُنعت لتناسب كل لحظة</p>
</footer>

<script src="/js/cart.js"></script>
<script src="/js/main.js"></script>
<script>
  (async () => {
    const products = await fetchProducts();
    const featured = products.filter((p) => p.featured);
    const grid = document.getElementById("featured-grid");
    grid.innerHTML = (featured.length ? featured : products).slice(0, 4).map(productCardHTML).join("");
  })();
</script>
</body>
</html>
