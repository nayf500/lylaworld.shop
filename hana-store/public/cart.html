<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>السلة | عالم ليلى</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<header class="site">
  <a class="logo" href="/">عالم ليلى</a>
  <nav class="main">
    <a href="/">الرئيسية</a>
    <a href="/shop.html">تسوّقي</a>
    <a href="/cart.html">السلة</a>
  </nav>
  <div class="header-actions">
    <a class="icon-btn" href="/cart.html">🛍<span class="cart-count">0</span></a>
  </div>
</header>

<div class="page-title"><h1>سلة التسوق</h1></div>
<div id="cart-container"></div>

<footer class="site">
  <div class="logo">عالم ليلى</div>
  <p>© 2026 عالم ليلى للساعات — صُنعت لتناسب كل لحظة</p>
</footer>

<script src="/js/cart.js"></script>
<script>
  async function render() {
    const container = document.getElementById("cart-container");
    const cart = getCart();

    if (cart.length === 0) {
      container.innerHTML = `
        <div class="empty-msg">
          <p style="font-size:40px;margin-bottom:14px;">🛍</p>
          <p>سلتكِ فارغة حالياً</p>
          <br>
          <a href="/shop.html"><button class="btn-soft">تسوّقي الآن</button></a>
        </div>`;
      return;
    }

    const products = await Promise.all(
      cart.map((item) => fetch(`/api/products/${item.product_id}`).then((r) => r.json()))
    );

    let total = 0;
    const itemsHTML = cart.map((item, idx) => {
      const p = products[idx];
      if (!p) return "";
      total += p.price * item.qty;
      return `
        <div class="cart-item">
          <div class="thumb"><div class="mini-watch"></div></div>
          <div class="info">
            <h4>${p.name}</h4>
            <div class="cat">${p.category} — ${p.price.toFixed(0)} ر.س</div>
          </div>
          <div class="qty-box">
            <button onclick="changeQty(${p.id}, ${item.qty - 1})">−</button>
            <span>${item.qty}</span>
            <button onclick="changeQty(${p.id}, ${item.qty + 1})">+</button>
          </div>
          <button class="remove" onclick="removeItem(${p.id})">إزالة</button>
        </div>
      `;
    }).join("");

    container.innerHTML = `
      <div class="cart-page">
        <div>${itemsHTML}</div>
        <div class="summary">
          <h3>ملخص الطلب</h3>
          <div class="row"><span>عدد القطع</span><span>${cart.reduce((s,i)=>s+i.qty,0)}</span></div>
          <div class="row"><span>الشحن</span><span>يُحسب لاحقاً</span></div>
          <div class="row total"><span>الإجمالي</span><span>${total.toFixed(0)} ر.س</span></div>
          <br>
          <a href="/checkout.html"><button class="btn-soft btn-block">إتمام الطلب</button></a>
        </div>
      </div>
    `;
  }

  function changeQty(id, qty) {
    updateCartQty(id, qty);
    render();
  }
  function removeItem(id) {
    removeFromCart(id);
    render();
  }

  render();
</script>
</body>
</html>
