<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>لوحة التحكم | عالم ليلى</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<div class="admin-shell">
  <div class="admin-header">
    <h1 style="font-size:24px;">لوحة تحكم عالم ليلى</h1>
    <a href="/"><button class="btn-outline">عرض المتجر ↗</button></a>
  </div>

  <div class="tabs">
    <button class="active" id="tab-products" onclick="showTab('products')">المنتجات</button>
    <button id="tab-orders" onclick="showTab('orders')">الطلبات</button>
  </div>

  <div id="products-view">
    <button class="btn-soft" style="margin-bottom:16px;" onclick="openModal()">+ إضافة منتج</button>
    <table class="admin-table">
      <thead>
        <tr><th>الاسم</th><th>الفئة</th><th>السعر</th><th>المخزون</th><th>مميز</th><th></th></tr>
      </thead>
      <tbody id="products-body"></tbody>
    </table>
  </div>

  <div id="orders-view" style="display:none;">
    <table class="admin-table">
      <thead>
        <tr><th>#</th><th>العميل</th><th>الجوال</th><th>المدينة</th><th>الإجمالي</th><th>الحالة</th><th>التاريخ</th></tr>
      </thead>
      <tbody id="orders-body"></tbody>
    </table>
  </div>
</div>

<div class="modal-bg" id="modal-bg">
  <div class="modal">
    <h3 id="modal-title">إضافة منتج</h3>
    <input type="hidden" id="p-id">
    <div class="form-group"><label>الاسم</label><input id="p-name"></div>
    <div class="form-group"><label>الفئة</label>
      <select id="p-category" style="width:100%;padding:13px;border-radius:12px;border:1px solid var(--blush-deep);">
        <option value="ذهبي">ذهبي</option>
        <option value="فضي">فضي</option>
        <option value="وردي">وردي</option>
      </select>
    </div>
    <div class="form-group"><label>اللون (لعرض البطاقة)</label>
      <select id="p-color" style="width:100%;padding:13px;border-radius:12px;border:1px solid var(--blush-deep);">
        <option value="gold">ذهبي</option>
        <option value="silver">فضي</option>
        <option value="pink">وردي</option>
      </select>
    </div>
    <div class="form-group"><label>السعر (ر.س)</label><input id="p-price" type="number"></div>
    <div class="form-group"><label>المخزون</label><input id="p-stock" type="number"></div>
    <div class="form-group"><label>الوصف</label><textarea id="p-desc" rows="3"></textarea></div>
    <div class="form-group">
      <label><input type="checkbox" id="p-featured" style="width:auto;"> منتج مميز (يظهر بالصفحة الرئيسية)</label>
    </div>
    <div style="display:flex;gap:10px;">
      <button class="btn-soft" style="flex:1;" onclick="saveProduct()">حفظ</button>
      <button class="btn-outline" style="flex:1;" onclick="closeModal()">إلغاء</button>
    </div>
  </div>
</div>

<script>
  // تحقق بسيط: لو الطلب فشل بسبب عدم تسجيل الدخول نرجع لصفحة الدخول
  async function api(path, opts = {}) {
    const res = await fetch(path, { ...opts, headers: { "Content-Type": "application/json", ...(opts.headers || {}) } });
    if (res.status === 401) {
      location.href = "/admin/login.html";
      throw new Error("غير مصرح");
    }
    return res.json();
  }

  function showTab(tab) {
    document.getElementById("tab-products").classList.toggle("active", tab === "products");
    document.getElementById("tab-orders").classList.toggle("active", tab === "orders");
    document.getElementById("products-view").style.display = tab === "products" ? "block" : "none";
    document.getElementById("orders-view").style.display = tab === "orders" ? "block" : "none";
    if (tab === "orders") loadOrders();
  }

  async function loadProducts() {
    const products = await api("/api/admin/products");
    document.getElementById("products-body").innerHTML = products.map((p) => `
      <tr>
        <td>${p.name}</td>
        <td>${p.category}</td>
        <td>${p.price.toFixed(0)} ر.س</td>
        <td>${p.stock}</td>
        <td>${p.featured ? "✓" : "—"}</td>
        <td>
          <button class="edit" onclick='openModal(${JSON.stringify(p)})'>تعديل</button>
          <button class="del" onclick="deleteProduct(${p.id})">حذف</button>
        </td>
      </tr>
    `).join("");
  }

  async function loadOrders() {
    const orders = await api("/api/admin/orders");
    const statusLabel = { pending: "قيد الانتظار", paid: "مدفوع", failed: "فشل" };
    document.getElementById("orders-body").innerHTML = orders.map((o) => `
      <tr>
        <td>#${o.id}</td>
        <td>${o.customer_name}</td>
        <td>${o.phone}</td>
        <td>${o.city}</td>
        <td>${o.total.toFixed(0)} ر.س</td>
        <td>${statusLabel[o.status] || o.status}</td>
        <td>${new Date(o.created_at).toLocaleDateString("ar-SA")}</td>
      </tr>
    `).join("") || `<tr><td colspan="7" style="text-align:center;color:#aaa;">لا توجد طلبات بعد</td></tr>`;
  }

  function openModal(p) {
    document.getElementById("modal-title").textContent = p ? "تعديل منتج" : "إضافة منتج";
    document.getElementById("p-id").value = p ? p.id : "";
    document.getElementById("p-name").value = p ? p.name : "";
    document.getElementById("p-category").value = p ? p.category : "ذهبي";
    document.getElementById("p-color").value = p ? p.color : "gold";
    document.getElementById("p-price").value = p ? p.price : "";
    document.getElementById("p-stock").value = p ? p.stock : 10;
    document.getElementById("p-desc").value = p ? p.description : "";
    document.getElementById("p-featured").checked = p ? !!p.featured : false;
    document.getElementById("modal-bg").classList.add("open");
  }
  function closeModal() {
    document.getElementById("modal-bg").classList.remove("open");
  }

  async function saveProduct() {
    const id = document.getElementById("p-id").value;
    const body = {
      name: document.getElementById("p-name").value,
      category: document.getElementById("p-category").value,
      color: document.getElementById("p-color").value,
      price: Number(document.getElementById("p-price").value),
      stock: Number(document.getElementById("p-stock").value),
      description: document.getElementById("p-desc").value,
      featured: document.getElementById("p-featured").checked,
    };
    if (id) {
      await api(`/api/admin/products/${id}`, { method: "PUT", body: JSON.stringify(body) });
    } else {
      await api(`/api/admin/products`, { method: "POST", body: JSON.stringify(body) });
    }
    closeModal();
    loadProducts();
  }

  async function deleteProduct(id) {
    if (!confirm("تأكيد حذف هذا المنتج؟")) return;
    await api(`/api/admin/products/${id}`, { method: "DELETE" });
    loadProducts();
  }

  loadProducts();
</script>
</body>
</html>
