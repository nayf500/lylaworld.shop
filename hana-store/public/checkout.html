<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>إتمام الطلب | عالم ليلى</title>
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="https://unpkg.com/[email protected]/dist/moyasar.css">
</head>
<body>

<header class="site">
  <a class="logo" href="/">عالم ليلى</a>
  <nav class="main">
    <a href="/">الرئيسية</a>
    <a href="/shop.html">تسوّقي</a>
    <a href="/cart.html">السلة</a>
  </nav>
  <div class="header-actions">
    <a class="icon-btn" href="/cart.html">🛍<span class="cart-count">0</span></a>
  </div>
</header>

<div class="page-title"><h1>إتمام الطلب</h1></div>

<div class="checkout" id="checkout-container">
  <div>
    <form id="checkout-form">
      <div class="form-group">
        <label>الاسم الكامل</label>
        <input type="text" id="customer_name" required>
      </div>
      <div class="form-group">
        <label>رقم الجوال</label>
        <input type="tel" id="phone" required placeholder="05xxxxxxxx">
      </div>
      <div class="form-group">
        <label>المدينة</label>
        <input type="text" id="city" required>
      </div>
      <div class="form-group">
        <label>العنوان بالتفصيل</label>
        <textarea id="address" rows="3" required></textarea>
      </div>
      <button type="submit" class="btn-soft btn-block" id="submit-btn">المتابعة إلى الدفع</button>
      <div id="form-msg"></div>
    </form>

    <div id="payment-form-container"></div>
  </div>

  <div class="summary" id="order-summary">
    <h3>ملخص الطلب</h3>
    <div id="summary-items"></div>
    <div class="row total"><span>الإجمالي</span><span id="summary-total">0 ر.س</span></div>
  </div>
</div>

<footer class="site">
  <div class="logo">عالم ليلى</div>
  <p>© 2026 عالم ليلى للساعات — صُنعت لتناسب كل لحظة</p>
</footer>

<script src="/js/cart.js"></script>
<script src="https://unpkg.com/[email protected]/dist/moyasar.js"></script>
<script>
  const cart = getCart();

  async function renderSummary() {
    if (cart.length === 0) {
      document.getElementById("checkout-container").innerHTML =
        `<p style="grid-column:1/-1;text-align:center;color:#8a7f7f;padding:60px 0;">سلتكِ فارغة — <a href="/shop.html" style="color:var(--mauve);font-weight:700;">تسوّقي أولاً</a></p>`;
      return;
    }
    const products = await Promise.all(cart.map((i) => fetch(`/api/products/${i.product_id}`).then((r) => r.json())));
    let total = 0;
    const itemsHTML = cart.map((item, idx) => {
      const p = products[idx];
      total += p.price * item.qty;
      return `<div class="row"><span>${p.name} × ${item.qty}</span><span>${(p.price * item.qty).toFixed(0)} ر.س</span></div>`;
    }).join("");
    document.getElementById("summary-items").innerHTML = itemsHTML;
    document.getElementById("summary-total").textContent = `${total.toFixed(0)} ر.س`;
  }
  renderSummary();

  document.getElementById("checkout-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const msg = document.getElementById("form-msg");
    const submitBtn = document.getElementById("submit-btn");
    msg.innerHTML = "";
    submitBtn.disabled = true;
    submitBtn.textContent = "جارٍ إنشاء الطلب...";

    try {
      const res = await fetch("/api/checkout", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          customer_name: document.getElementById("customer_name").value,
          phone: document.getElementById("phone").value,
          city: document.getElementById("city").value,
          address: document.getElementById("address").value,
          items: cart,
        }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "حدث خطأ");

      if (!data.moyasar_publishable_key) {
        msg.innerHTML = `<div class="msg error">لم يتم إعداد بوابة الدفع بعد. الرجاء إضافة مفاتيح Moyasar في ملف .env (راجع README.md).</div>`;
        submitBtn.disabled = false;
        submitBtn.textContent = "المتابعة إلى الدفع";
        return;
      }

      // إخفاء نموذج البيانات وإظهار نموذج الدفع من Moyasar
      document.getElementById("checkout-form").style.display = "none";
      const paymentContainer = document.getElementById("payment-form-container");
      paymentContainer.innerHTML = `<div class="mysr-form"></div>`;

      Moyasar.init({
        element: ".mysr-form",
        amount: Math.round(data.total * 100), // بالهللة
        currency: "SAR",
        description: `طلب رقم ${data.order_id} - متجر عالم ليلى`,
        publishable_api_key: data.moyasar_publishable_key,
        callback_url: data.callback_url,
        methods: ["creditcard"],
      });
    } catch (err) {
      msg.innerHTML = `<div class="msg error">${err.message}</div>`;
      submitBtn.disabled = false;
      submitBtn.textContent = "المتابعة إلى الدفع";
    }
  });
</script>
</body>
</html>
