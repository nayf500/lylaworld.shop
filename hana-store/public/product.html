<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تفاصيل المنتج | عالم ليلى</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<header class="site">
  <a class="logo" href="/">عالم ليلى</a>
  <nav class="main">
    <a href="/">الرئيسية</a>
    <a href="/shop.html">تسوّقي</a>
    <a href="/cart.html">السلة</a>
  </nav>
  <div class="header-actions">
    <a class="icon-btn" href="/cart.html">🛍<span class="cart-count">0</span></a>
  </div>
</header>

<div id="detail-container">
  <p style="text-align:center;padding:80px;color:#aaa;">جارٍ التحميل...</p>
</div>

<footer class="site">
  <div class="logo">عالم ليلى</div>
  <p>© 2026 عالم ليلى للساعات — صُنعت لتناسب كل لحظة</p>
</footer>

<script src="/js/cart.js"></script>
<script>
  const id = new URLSearchParams(location.search).get("id");
  let qty = 1;

  async function load() {
    const container = document.getElementById("detail-container");
    if (!id) {
      container.innerHTML = `<p style="text-align:center;padding:80px;">منتج غير محدد</p>`;
      return;
    }
    const res = await fetch(`/api/products/${id}`);
    if (!res.ok) {
      container.innerHTML = `<p style="text-align:center;padding:80px;">المنتج غير موجود</p>`;
      return;
    }
    const p = await res.json();
    document.title = `${p.name} | عالم ليلى`;
    container.innerHTML = `
      <div class="detail">
        <div class="detail-img ${p.color}"><div class="mini-watch"></div></div>
        <div class="detail-info">
          <div class="cat">${p.category}</div>
          <h1>${p.name}</h1>
          <div class="price">${p.price.toFixed(0)} ر.س</div>
          <p class="desc">${p.description || ""}</p>
          ${p.stock > 0 ? `
            <div class="qty-row">
              <div class="qty-box">
                <button onclick="changeQty(-1)">−</button>
                <span id="qty-val">1</span>
                <button onclick="changeQty(1)">+</button>
              </div>
              <span style="color:#999;font-size:13px;">${p.stock} قطعة متوفرة</span>
            </div>
            <button class="btn-soft btn-block" onclick="addAndGo(${p.id})">أضيفي إلى السلة</button>
          ` : `<p style="color:#B23A3A;font-weight:700;">غير متوفر حالياً</p>`}
        </div>
      </div>
    `;
  }

  function changeQty(delta) {
    qty = Math.max(1, qty + delta);
    document.getElementById("qty-val").textContent = qty;
  }

  function addAndGo(productId) {
    addToCart(productId, qty);
    location.href = "/cart.html";
  }

  load();
</script>
</body>
</html>
