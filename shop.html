<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تسوّقي | عالم ليلى</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<header class="site">
  <a class="logo" href="/">عالم ليلى</a>
  <nav class="main">
    <a href="/">الرئيسية</a>
    <a href="/shop.html">تسوّقي</a>
    <a href="/cart.html">السلة</a>
  </nav>
  <div class="header-actions">
    <a class="icon-btn" href="/cart.html">🛍<span class="cart-count">0</span></a>
  </div>
</header>

<div class="page-title"><h1>كل الساعات</h1></div>
<div class="filters" id="filters">
  <button class="active" data-cat="">الكل</button>
  <button data-cat="ذهبي">ذهبي</button>
  <button data-cat="فضي">فضي</button>
  <button data-cat="وردي">وردي</button>
</div>
<div class="grid" id="grid"></div>

<footer class="site">
  <div class="logo">عالم ليلى</div>
  <p>© 2026 عالم ليلى للساعات — صُنعت لتناسب كل لحظة</p>
</footer>

<script src="/js/cart.js"></script>
<script src="/js/main.js"></script>
<script>
  async function render(category) {
    const grid = document.getElementById("grid");
    grid.innerHTML = `<p style="grid-column:1/-1;text-align:center;color:#aaa;">جارٍ التحميل...</p>`;
    const products = await fetchProducts(category);
    grid.innerHTML = products.length
      ? products.map(productCardHTML).join("")
      : `<p style="grid-column:1/-1;text-align:center;color:#aaa;">لا توجد منتجات في هذا التصنيف</p>`;
  }

  document.querySelectorAll("#filters button").forEach((btn) => {
    btn.addEventListener("click", () => {
      document.querySelectorAll("#filters button").forEach((b) => b.classList.remove("active"));
      btn.classList.add("active");
      render(btn.dataset.cat);
    });
  });

  render("");
</script>
</body>
</html>
